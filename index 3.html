  if(a==='tnext'){car.tut=car.tut==='hub1'?'hub2':null;save();sfx('click');scr.render();return true}return false}
function coValid(){const c=car&&car.callout;if(!c)return null;if(c.kind==='pro'&&(!car.roster[c.id]||car.order.indexOf(c.id)<0||car.order.indexOf(c.id)>RN())){car.callout=null;return null}return c}
function makeCallout(){if(car.tut||car.retired)return null;
  if(!car.pro){const am=genAm();const lv=rand(3,4.4);STATK.forEach(k=>am.stats[k]=clamp(Math.round(lv+rand(-.8,.8)),1,7));am.rec={w:4+ri(5),l:ri(3),d:0,ko:2+ri(3),sub:0};
    return{kind:'am',am,name:am.name,pay:Math.round(AMPURSE*2.2/50)*50,msg:`${am.name} has been running his mouth, saying you're all hype. He called you out. Take it and the promoter pays double.`,at:car.fights}}
  const pi=pIdx(),n=RN();let lo,hi;if(pi>n){lo=n-4;hi=n}else{lo=Math.max(1,pi-3);hi=Math.min(n,pi+3)}
  const cands=[];for(let r=lo;r<=hi;r++)if(r!==pi&&car.order[r]&&car.order[r]!=='P')cands.push(r);if(!cands.length)return null;
  const r=pick(cands),id=car.order[r],f=car.roster[id];const above=pi>n||r<pi;
  return{kind:'pro',id,name:f.name,pay:Math.round(purse(r)*1.8/50)*50,msg:above?`#${r} ${f.name} called you out on TV and said you're a nobody. Shut him up and the purse is huge.`:`${f.name} wants your spot and called you out in front of the cameras. The promoter is offering big money.`,at:car.fights}}
function coAfter(out,wasCo){if(wasCo)car.callout=null;else if(car.callout){out.notes.push(car.callout.name+' says you ducked him');car.callout=null}
  if(!car.tut&&car.fights>=1&&Math.random()<.15){const c=makeCallout();if(c){car.callout=c;car.coach=c.msg;out.notes.push('CALLOUT: '+c.name)}}}
function coachBubble(text){return`<div class="bub" style="${at(74,164,178,74)}"><span>${esc(text)}</span></div>`}
function drawWallCoach(){g.drawImage(WALL,0,0);cx=g;drawFig(COACH,bob(PO.CROSSARMS,T*.6,.5),40,322,1,1.55,{armsFront:true})}
